<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次引导 · persistLog</title><link rel="stylesheet" href="assets/prototype-suite.css"><script defer src="assets/prototype-suite.js"></script></head><body><main class="auth-page"><section class="auth-intro"><a class="brand" href="index.html" style="padding:0;border:0;color:#fff"><div class="brand-mark">↗</div><div class="brand-copy"><strong>恒序</strong><small style="color:#bfc8e4">persistLog</small></div></a><div style="margin-top:70px"><div class="eyebrow" style="color:#9ea9dd">First setup</div><h1>先设定方向，<br>再让系统帮你守住节奏。</h1><p>只需要几分钟，恒序会据此计算每天可执行的容量和路线预测。</p></div></section><section class="auth-panel"><div class="eyebrow">Step 2 of 4</div><h2>你的目标是什么？</h2><p>目标越具体，路线越容易被验证。</p><div class="stepper" style="margin-top:0"><div class="step done"><div class="step-dot">✓</div>档案</div><div class="step active"><div class="step-dot">2</div>目标</div><div class="step"><div class="step-dot">3</div>导入</div><div class="step"><div class="step-dot">4</div>完成</div></div><div class="field"><label>目标名称</label><input value="Java 后端实习"></div><div class="field"><label>目标岗位</label><input value="后端开发工程师"></div><div class="field"><label>目标日期</label><input value="2026-11-10" type="date"></div><div class="field"><label>每天可投入时间</label><select><option>240 分钟</option><option>180 分钟</option><option>120 分钟</option></select></div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:8px"><button class="btn">上一步</button><button class="btn primary" data-action="toast" data-message="已进入导入计划">继续</button></div><div class="auth-foot">后续可以在设置中修改目标与容量。</div></section></main></body></html>
