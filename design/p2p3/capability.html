<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="P3 能力准备度、证据覆盖、时间衰减和未评估状态原型。">
  <title>能力看板 · P3 原型 · 恒序</title>
  <link rel="stylesheet" href="assets/prototype.css">
  <script defer src="assets/prototype.js"></script>
</head>
<body data-page="capability">
  <template id="page-content">
    <header class="page-head"><div><h1>能力看板</h1><p>用可追溯的证据呈现准备程度；没有足够证据的能力保持未评估，不按 0 分处理。</p></div><span class="tag">更新至 11月15日 · 演示数据</span></header>
    <div class="notice notice--info" style="margin-bottom:20px">准备度仅汇总已评估能力，不能解读为全部能力的绝对掌握程度。代码、提问与工程记录仅用于展示证据结构。</div>
    <div class="segmented" aria-label="能力评估状态"><button type="button" data-capability-filter="all" aria-pressed="true">全部能力</button><button type="button" data-capability-filter="assessed" aria-pressed="false">已评估</button><button type="button" data-capability-filter="unassessed" aria-pressed="false">未评估</button></div>

    <div class="split">
      <div class="stack">
        <section class="card"><div class="card__head"><div><h2>已评估能力</h2><p>权重总和 60%，以下分数用于演示评估结果，不由前端计算。</p></div><span class="tag tag--good">5 项已评估</span></div><div class="card__body"><div class="capability-list">
          <div class="capability-row" data-assessed="true"><div class="capability-row__name"><strong>算法</strong><small>路线权重 20% · 置信度 0.78</small></div><div class="capability-row__bar"><div class="progress progress--good" role="img" aria-label="算法 72 分"><span style="width:72%"></span></div></div><div class="capability-row__score">72<small>5 条证据</small></div><div class="capability-row__action"><button class="btn btn--sm" type="button" data-evidence="algorithm">查看证据</button></div></div>
          <div class="capability-row" data-assessed="true"><div class="capability-row__name"><strong>数据结构</strong><small>路线权重 15% · 置信度 0.72</small></div><div class="capability-row__bar"><div class="progress progress--good" role="img" aria-label="数据结构 68 分"><span style="width:68%"></span></div></div><div class="capability-row__score">68<small>4 条证据</small></div><div class="capability-row__action"><button class="btn btn--sm" type="button" data-evidence="structure">查看证据</button></div></div>
          <div class="capability-row" data-assessed="true"><div class="capability-row__name"><strong>操作系统</strong><small>路线权重 10% · 置信度 0.62</small></div><div class="capability-row__bar"><div class="progress progress--good" role="img" aria-label="操作系统 63 分"><span style="width:63%"></span></div></div><div class="capability-row__score">63<small>3 条证据</small></div><div class="capability-row__action"><button class="btn btn--sm" type="button" data-evidence="os">查看证据</button></div></div>
          <div class="capability-row" data-assessed="true"><div class="capability-row__name"><strong>数据库</strong><small>路线权重 10% · 置信度 0.61</small></div><div class="capability-row__bar"><div class="progress progress--good" role="img" aria-label="数据库 70 分"><span style="width:70%"></span></div></div><div class="capability-row__score">70<small>3 条证据</small></div><div class="capability-row__action"><button class="btn btn--sm" type="button" data-evidence="database">查看证据</button></div></div>
          <div class="capability-row" data-assessed="true"><div class="capability-row__name"><strong>工程化</strong><small>路线权重 5% · 置信度 0.71</small></div><div class="capability-row__bar"><div class="progress progress--good" role="img" aria-label="工程化 78 分"><span style="width:78%"></span></div></div><div class="capability-row__score">78<small>4 条证据</small></div><div class="capability-row__action"><button class="btn btn--sm" type="button" data-evidence="engineering">查看证据</button></div></div>
        </div></div></section>
        <section class="card"><div class="card__head"><div><h2>未评估能力</h2><p>证据数不足 3 条或置信度低于 0.5，不绘制 0 分进度条。</p></div><span class="tag tag--neutral">6 项未评估</span></div><div class="card__body"><div class="capability-list">
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>计算机网络</strong><small>路线权重 15%</small></div><div class="capability-row__bar"><span class="small muted">还需 1 条有效证据</span></div><div class="capability-row__score muted">—<small>2 条证据</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>系统设计</strong><small>路线权重 10%</small></div><div class="capability-row__bar"><span class="small muted">还需 2 条有效证据</span></div><div class="capability-row__score muted">—<small>1 条证据</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>语言基础</strong><small>路线权重 5%</small></div><div class="capability-row__bar"><span class="small muted">置信度尚未达到 0.5</span></div><div class="capability-row__score muted">—<small>置信度 0.42</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>项目表达</strong><small>路线权重 5%</small></div><div class="capability-row__bar"><span class="small muted">还需 2 条有效证据</span></div><div class="capability-row__score muted">—<small>1 条证据</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>简历表达</strong><small>路线权重 3%</small></div><div class="capability-row__bar"><span class="small muted">还需 2 条有效证据</span></div><div class="capability-row__score muted">—<small>1 条证据</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
          <div class="capability-row" data-assessed="false"><div class="capability-row__name"><strong>面试沟通</strong><small>路线权重 2%</small></div><div class="capability-row__bar"><span class="small muted">尚无足够证据</span></div><div class="capability-row__score muted">—<small>未评估</small></div><div class="capability-row__action"><a class="btn btn--sm" href="quiz.html">去提问</a></div></div>
        </div></div></section>
      </div>
      <div class="stack">
        <section class="card" style="padding:24px"><span class="focus-label">路线内加权准备度</span><div class="score-value" style="margin:12px 0">70<small> / 100</small></div><div class="progress progress--good" role="img" aria-label="已评估能力的路线内加权准备度 70 分"><span style="width:70%"></span></div><p class="small muted" style="margin-top:12px">只统计 5 项已评估能力，未评估项不计为 0 分。</p></section>
        <section class="card"><div class="stat-strip" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="stat-item"><span class="stat-item__label">证据覆盖率</span><strong class="stat-item__value">60<small>%</small></strong><span class="stat-item__note">6 项尚未形成评估</span></div><div class="stat-item"><span class="stat-item__label">有效证据</span><strong class="stat-item__value">19<small> 条</small></strong><span class="stat-item__note">来自 5 项已评估能力</span></div><div class="stat-item"><span class="stat-item__label">证据时间衰减</span><strong class="stat-item__value" style="font-size:22px">30<small> 天</small></strong><span class="stat-item__note">半衰期 · 旧证据降权</span></div><div class="stat-item"><span class="stat-item__label">已评估能力</span><strong class="stat-item__value">5<small> / 11 项</small></strong><span class="stat-item__note">至少 3 条证据且置信度 ≥ 0.5</span></div></div></section>
        <section class="card"><div class="card__head"><div><h2>证据权重</h2><p>优先使用可验证的实际产出。</p></div></div><div class="card__body"><ul class="check-list"><li><strong>代码 / 工程证据 <span class="num text-good">1.0</span></strong><p>有提交、代码片段或任务结果可追溯。</p></li><li><strong>八股 / 项目回答 <span class="num">0.8</span></strong><p>来自文字提问与项目追问。</p></li><li><strong>外部测评 <span class="num">0.6</span></strong><p>只记录用户填写的来源与结果，不自动抓取。</p></li><li><strong>自评 <span class="num text-warning">0.3</span></strong><p>用于补充视角，不替代实际证据。</p></li></ul><details class="details"><summary>评估口径与时间衰减</summary><div class="details__body">每项能力至少需要 3 条有效证据，且评估置信度至少为 0.5。证据随时间衰减，半衰期为 30 天；路线权重用于组织目标，证据权重用于表示来源可靠性，两者不能混为一谈。实际计算和总分由后端领域逻辑负责。</div></details></div></section>
        <section class="card"><div class="card__head"><div><h2>外部练习</h2><p>固定链接，只打开网站，不传递用户数据。</p></div></div><div class="card__body"><div class="actions"><a class="btn btn--sm" href="https://leetcode.cn/" target="_blank" rel="noopener noreferrer">LeetCode<svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg></a><a class="btn btn--sm" href="https://www.nowcoder.com/" target="_blank" rel="noopener noreferrer">牛客<svg class="icon" aria-hidden="true"><use href="#icon-external"></use></svg></a></div></div></section>
      </div>
    </div>
    <dialog id="evidence-dialog" class="drawer" aria-labelledby="evidence-title"><div class="dialog-head"><div><h2 id="evidence-title">证据记录</h2><p id="evidence-subtitle"></p></div><button class="icon-button" type="button" data-close-dialog aria-label="关闭证据记录"><svg class="icon" aria-hidden="true"><use href="#icon-x"></use></svg></button></div><div class="dialog-body"><ul class="list" id="evidence-list"></ul><div class="notice" style="margin-top:18px">证据列表只展示来源、日期、摘要和来源权重；评估结论必须可以回溯到原始记录。</div></div></dialog>
  </template>
  <div id="prototype-root"></div>
  <noscript><p class="no-script">请启用 JavaScript，以浏览和操作这个静态原型。</p></noscript>
</body>
</html>
