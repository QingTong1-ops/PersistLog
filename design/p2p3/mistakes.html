<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="P3 错题库、复习阶段、作答反馈与间隔重复调度原型。">
  <title>错题与复习 · P3 原型 · 恒序</title>
  <link rel="stylesheet" href="assets/prototype.css">
  <script defer src="assets/prototype.js"></script>
</head>
<body data-page="mistakes">
  <template id="page-content">
    <header class="page-head"><div><h1>错题与复习</h1><p>保留原始回答和参考要点，在到期时重新作答；不需要额外整理抄题任务。</p></div><div class="page-head__actions"><a class="btn" href="review-settings.html"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg>复习设置</a></div></header>

    <section class="card" style="margin-bottom:20px"><div class="stat-strip">
      <div class="stat-item"><span class="stat-item__label">今日到期</span><strong class="stat-item__value"><span id="due-count">3</span><small> / 10 题</small></strong><span class="stat-item__note">复习上限 · 示例数据</span></div>
      <div class="stat-item"><span class="stat-item__label">占用今日容量</span><strong class="stat-item__value">15<small> 分钟</small></strong><span class="stat-item__note">未超过 35% 调度上限</span></div>
      <div class="stat-item"><span class="stat-item__label">最早复习阶段</span><strong class="stat-item__value" style="font-size:22px">第 2 天</strong><span class="stat-item__note">默认间隔可调整</span></div>
      <div class="stat-item"><span class="stat-item__label">最长复习阶段</span><strong class="stat-item__value" style="font-size:22px">第 28 天</strong><span class="stat-item__note">以真实调度结果为准</span></div>
    </div></section>

    <div id="mistake-library" class="stack">
      <div class="split">
        <section class="card">
          <div class="card__head"><div><h2>今日到期</h2><p>共 3 道示例题，低于每日 10 题的配额上限。</p></div><div class="filters"><label><span class="sr-only">按知识点筛选</span><select data-mistake-filter="knowledge"><option value="all">全部知识点</option><option value="network">计算机网络</option><option value="jvm">JVM</option><option value="project">项目表达</option></select></label><label><span class="sr-only">按问题类型筛选</span><select data-mistake-filter="errorType"><option value="all">全部问题类型</option><option value="concept">概念不清</option><option value="boundary">边界遗漏</option><option value="expression">表达结构缺失</option></select></label></div></div>
          <div class="card__body"><ul class="list">
            <li class="list-row" data-mistake-index="0" data-knowledge="network" data-error-type="concept"><div class="list-row__main"><div class="actions" style="margin-bottom:7px"><span class="tag tag--neutral">计算机网络</span><span class="tag tag--warning">概念不清</span></div><p class="list-row__title">强缓存与协商缓存分别如何判断是否命中？</p><p class="list-row__meta"><span>每日提问 · 11月12日</span><span>当前阶段：第 3 天</span></p><details class="mistake-detail"><summary>查看原始回答与参考要点</summary><div class="mistake-detail__grid"><div><h4>原始回答</h4><p>只要设置 ETag，浏览器就不会再发送请求。</p></div><div><h4>参考要点</h4><p>先判断本地缓存是否有效，过期后再用验证器向服务端确认。</p></div></div></details></div><div class="list-row__side"><span class="tag">今天到期</span></div></li>
            <li class="list-row" data-mistake-index="1" data-knowledge="jvm" data-error-type="boundary"><div class="list-row__main"><div class="actions" style="margin-bottom:7px"><span class="tag tag--neutral">JVM</span><span class="tag tag--warning">边界遗漏</span></div><p class="list-row__title">线程池的队列满且达到最大线程数后会发生什么？</p><p class="list-row__meta"><span>代码评审 · 11月11日</span><span>当前阶段：第 2 天</span></p><details class="mistake-detail"><summary>查看原始回答与参考要点</summary><div class="mistake-detail__grid"><div><h4>原始回答</h4><p>会继续创建新线程处理请求。</p></div><div><h4>参考要点</h4><p>达到最大线程数后进入拒绝策略，需要说明策略与调用方影响。</p></div></div></details></div><div class="list-row__side"><span class="tag">今天到期</span></div></li>
            <li class="list-row" data-mistake-index="2" data-knowledge="project" data-error-type="expression"><div class="list-row__main"><div class="actions" style="margin-bottom:7px"><span class="tag tag--neutral">项目表达</span><span class="tag tag--warning">表达结构缺失</span></div><p class="list-row__title">如何向面试官解释订单接口的幂等设计？</p><p class="list-row__meta"><span>项目提问 · 11月10日</span><span>当前阶段：第 7 天</span></p><details class="mistake-detail"><summary>查看原始回答与参考要点</summary><div class="mistake-detail__grid"><div><h4>原始回答</h4><p>加一个幂等键，重复请求就不处理了。</p></div><div><h4>参考要点</h4><p>说明请求标识、原子校验、唯一约束、结果返回与异常补偿。</p></div></div></details></div><div class="list-row__side"><span class="tag">今天到期</span></div></li>
          </ul><div class="empty" id="filter-empty" hidden><h3>当前筛选下没有到期错题</h3><p>可以切换知识点或问题类型。</p></div><div class="empty" id="library-empty" hidden><h3>今日复习已完成</h3><p>本次仅演示 3 道题的调度过程，没有写入真实复习记录。</p><button class="btn" type="button" onclick="window.location.reload()">重新演示</button></div></div>
        </section>
        <div class="stack">
          <section class="focus-card card"><div><span class="focus-label">间隔重复 · 3 题到期</span><h2>先回答，再对照</h2><p>看清参考要点后，再按掌握情况选择结果；不是凭熟悉感直接跳过。</p><div class="meta"><span><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg>约 15 分钟</span><span>上限 10 题 / 天</span></div></div><div class="focus-actions"><button class="btn btn--primary" id="start-review" type="button"><svg class="icon" aria-hidden="true"><use href="#icon-play"></use></svg>开始复习（3 题）</button></div></section>
          <section class="card"><div class="card__head"><div><h2>默认复习节奏</h2><p>间隔从当前阶段起计算，可在设置中修改。</p></div></div><div class="card__body"><div class="timeline" aria-label="第2天、第3天、第7天、第14天、第28天"><div class="timeline__item"><div class="timeline__dot"></div><strong>第 2 天</strong>初次回顾</div><div class="timeline__line"></div><div class="timeline__item"><div class="timeline__dot"></div><strong>第 3 天</strong>再次确认</div><div class="timeline__line"></div><div class="timeline__item"><div class="timeline__dot"></div><strong>第 7 天</strong>阶段巩固</div><div class="timeline__line"></div><div class="timeline__item"><div class="timeline__dot"></div><strong>第 14 天</strong>长期记忆</div><div class="timeline__line"></div><div class="timeline__item"><div class="timeline__dot"></div><strong>第 28 天</strong>周期复盘</div></div><details class="details"><summary>掌握情况如何影响下次复习</summary><div class="details__body">答错：回退一阶段，并在次日再次出现。答对但不确定：保持当前阶段，下次仍复习。答对且确定：进阶到下一阶段。最终结果由后端调度计算，不能由前端直接改写。</div></details></div></section>
        </div>
      </div>
    </div>

    <section id="review-session" class="stack" hidden aria-label="错题复习会话">
      <div class="card" id="review-card"><div class="card__head"><div><span class="focus-label" id="review-position">第 1 / 3 题</span><h2 style="margin-top:8px;font-size:22px;max-width:780px" id="review-title">强缓存与协商缓存分别如何判断是否命中？</h2><p id="review-source">每日提问 · 11月12日</p></div><span class="tag" id="review-stage">当前阶段：第 3 天</span></div><div class="card__body">
        <div class="field"><label for="review-input">先用自己的话回答</label><textarea id="review-input" placeholder="演示时可先回想回答，再展开参考要点。"></textarea></div>
        <div class="actions" style="margin-top:14px"><button class="btn btn--primary" id="reveal-review" type="button">对照原始回答与参考要点</button><button class="btn" id="back-mistakes" type="button">稍后再复习</button></div>
        <div id="review-answer" style="margin-top:20px" hidden><div class="mistake-detail__grid"><div><h4>当时的回答</h4><p id="review-original"></p></div><div><h4>参考要点</h4><p id="review-reference"></p></div></div><p class="field__hint" style="margin-top:12px">请根据本次回答的实际掌握情况选择结果，而不是根据原回答选择。</p><div class="review-actions"><button class="btn btn--danger" type="button" data-review-rating="wrong">答错<br><small>回退并次日重现</small></button><button class="btn" type="button" data-review-rating="unsure">答对，但不确定<br><small>保持当前阶段</small></button><button class="btn btn--primary" type="button" data-review-rating="correct">答对且确定<br><small>进入下一阶段</small></button></div><p class="notice notice--good" id="review-schedule-result" role="status" style="margin-top:14px" hidden></p></div>
      </div></div>
      <div class="empty card" id="review-complete" hidden><h3>3 道到期错题已处理</h3><p>这是调度流程演示，不会保存回答或调整真实复习日期。</p><button class="btn btn--primary" id="review-finished" type="button">返回错题库</button></div>
    </section>
  </template>
  <div id="prototype-root"></div>
  <noscript><p class="no-script">请启用 JavaScript，以浏览和操作这个静态原型。</p></noscript>
</body>
</html>
