<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="P2 代码练习、可查看详情的提交历史与异步评审入口原型。">
  <title>代码练习 · P2 原型 · 恒序</title>
  <link rel="stylesheet" href="assets/prototype.css">
  <script defer src="assets/prototype.js"></script>
  <script defer src="assets/practice-review.js"></script>
</head>
<body data-page="practice">
  <template id="page-content">
    <header class="page-head"><div><h1>代码练习</h1><p>提交代码后异步评审。点击任一历史记录，查看代码快照、最新进度和完整反馈。</p></div><div class="page-head__actions"><a class="btn btn--primary" href="practice-detail.html"><svg class="icon" aria-hidden="true"><use href="#icon-code"></use></svg>提交代码</a></div></header>
    <div class="stack">
      <section class="card focus-card" aria-labelledby="practice-focus-title">
        <div><span class="focus-label">下一项代码任务 · 示例</span><h2 id="practice-focus-title">实现支持过期时间的 LRU 缓存</h2><p>提交代码、自测结果和复杂度说明，再在独立评审页跟踪进度。</p><div class="meta"><span><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg>预计 60 分钟</span><span>中等难度</span><span>Java / Python</span><span>学习路线 · 第 3 阶段</span></div></div>
        <div class="focus-actions"><a class="btn btn--primary" href="practice-detail.html">开始提交</a><a class="btn" href="practice-review.html?submission=04">查看评审详情</a></div>
      </section>

      <section class="card stat-strip" aria-label="近30天代码练习演示指标">
        <div class="stat-item"><span class="stat-item__label">近 30 天提交</span><strong class="stat-item__value">12 <small>次</small></strong><span class="stat-item__note">网页代码提交</span></div>
        <div class="stat-item"><span class="stat-item__label">平均评审得分</span><strong class="stat-item__value">76 <small>/ 100</small></strong><span class="stat-item__note">仅统计已完成的评审</span></div>
        <div class="stat-item"><span class="stat-item__label">最高评审得分</span><strong class="stat-item__value">88 <small>/ 100</small></strong><span class="stat-item__note">不是能力准备度</span></div>
        <div class="stat-item"><span class="stat-item__label">改进项完成</span><strong class="stat-item__value">5 / 8 <small>项</small></strong><span class="stat-item__note">用户主动标记</span></div>
      </section>

      <div class="split">
        <section class="card">
          <div class="card__head"><div><h2>提交历史</h2><p id="practice-filter-count">当前显示 5 条示例记录</p></div><label class="filters"><span class="sr-only">筛选评审状态</span><select id="practice-filter"><option value="all">全部状态</option><option value="pending">待评审 / 评审中</option><option value="succeeded">已评审</option><option value="insufficient">证据不足</option><option value="failed">评审失败</option></select></label></div>
          <div class="card__body">
            <ul class="list" id="practice-history-list" aria-label="可查看详情的提交历史"></ul>
            <div class="empty" id="practice-empty" hidden><h3>当前筛选没有记录</h3><p>可以切换状态，查看其他示例提交。</p></div>
          </div>
        </section>
        <div class="stack">
          <section class="card"><div class="card__head"><div><h2>提交后不用等待</h2><p>评审任务与提交记录分开保存。</p></div></div><div class="card__body"><ol class="check-list"><li><strong>1. 创建提交</strong><p>保留代码文件、语言、自测与复杂度说明。</p></li><li><strong>2. 跟踪进度</strong><p>提交成功后进入评审页，可离开后再回来查看最新状态。</p></li><li><strong>3. 根据证据改进</strong><p>在同一页查看评分、扣分依据、改进方向和追问。</p></li></ol></div></section>
          <div class="notice notice--info"><strong>仅做静态评审。</strong>真实功能应由 Agent 读取已授权的代码快照，不执行代码、不运行隐藏测试，也不提供 AC 判定。本原型不调用真实 Agent。</div>
          <section class="card"><div class="card__head"><div><h2>待完成的改进</h2><p>来自最近一次的评审示例。</p></div><span class="tag">1 项</span></div><div class="card__body"><p class="list-row__title">补齐缓存过期后的读取判断</p><p class="list-row__meta">增加过期键自测，再重新提交。</p><div style="margin-top:14px"><a class="btn btn--sm" href="practice-review.html?submission=04">查看改进说明</a></div></div></section>
        </div>
      </div>
    </div>
  </template>
  <div id="prototype-root"></div>
  <noscript><p class="no-script">请启用 JavaScript，以浏览和操作这个静态原型。</p></noscript>
</body>
</html>
